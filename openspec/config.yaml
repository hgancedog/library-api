# ──────────────────────────────────────────────────────────────
# KNOWN ISSUES / TECH DEBT — STAGE 1
# ──────────────────────────────────────────────────────────────
tech_debt:
  - id: TD-001
    file: src/app/models.py
    description: >
      Loan.return_date uses Optional[date] instead of date | None.
      Should be migrated for consistency with the rest of the codebase.
    severity: minor
    stage_to_fix: 1

  - id: TD-002
    description: >
      pytest is not yet in pyproject.toml dev dependencies.
      app/tests/ directory does not exist. No tests have been written yet.
      This is the primary blocker for Stage 1 completion.
    severity: blocking
    stage_to_fix: 1

  - id: TD-004
    file: pyproject.toml, openspec/config.yaml
    description: >
      Four fields are duplicated between pyproject.toml and openspec/config.yaml
      (name, version, author, line-length). Keep them in sync manually.
    severity: minor
    stage_to_fix: 1
    resolution: note_only

  - id: TD-003
    file: src/app/library_service.py
    description: >
      register_user validates email with a plain regex in service code.
      This should be replaced by Pydantic v2 validators when Stage 3 introduces Pydantic.
      Acceptable as manual validation for Stage 1.
    severity: minor
    stage_to_fix: 3

