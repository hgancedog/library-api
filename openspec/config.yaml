# openspec/config.yaml
# SDD / OpenSpec project configuration for library-api
# Updated: 2026-07-10 · Stage 1 · Foundations
#
# RULES FOR THIS FILE:
#   1. Describe ONLY what exists on disk right now — no aspirational content.
#   2. The future lives in project_docs/ROADMAP_FINAL_2026.md.
#   3. Re-verify after any file creation/deletion or branch switch.
#   4. Keep in sync with pyproject.toml (name, version, author, line-length).
#
# Do not destructively edit the SDD section by hand — update via Pi SDD phases.
# Project context (stack, conventions, roadmap) is safe to update manually.

# ──────────────────────────────────────────────────────────────
# PROJECT IDENTITY
# ──────────────────────────────────────────────────────────────
project:
  name: library-api
  version: "1.0.0" # pyproject.toml version
  description: >
    Library Management System — a backend learning project that evolves through
    12 stages from in-memory Python to AI-native microservices architecture.
    Each stage lives in its own Git branch and introduces a new layer of
    professional backend engineering.
  author: Hector Gancedo Grade
  root: /home/heks/PROJECTS/library-api
  language: Python
  python_runtime: "3.14.4" # verified: python --version in .venv
  current_stage: 1
  current_stage_name: Foundations
  current_branch: stage1-tdd-from-scratch # verified: git branch --show-current
  git_head: 02e4f0f # verified: git rev-parse --short HEAD

  roadmap_file: project_docs/ROADMAP_FINAL_2026.md
  stage_summaries: project_docs/stage_summaries.md
  total_stages: 12

# ──────────────────────────────────────────────────────────────
# STACK — STAGE 1 (verified installed and working)
# ──────────────────────────────────────────────────────────────
stack:
  - tool: Python
    version: "3.14.4"
    role: Primary language (venv)

  - tool: Pyright
    version: "1.1.410"
    role: Static type checker (strict mode)
    config: pyrightconfig.json
    status: passing # 0 errors, 0 warnings

  - tool: Ruff
    version: "0.15.0"
    role: Linter + formatter
    config: pyproject.toml [tool.ruff]
    line_length: 88
    target_version: py313
    lint_rules: ["E", "F", "W", "I", "N"]
    ignored_rules: ["E501"]
    quote_style: double
    status: passing # All checks passed

  - tool: Pytest
    version: ">=8.0"
    role: Test runner
    plugins: [pytest-cov>=6.0]
    config: pyproject.toml
    status: active # 12 tests, 0 failures

  - tool: pre-commit
    version: "4.5.1"
    role: Pre-commit hooks (ruff + venv check)
    config: .pre-commit-config.yaml

# ──────────────────────────────────────────────────────────────
# COMMANDS (verified working)
# ──────────────────────────────────────────────────────────────
commands:
  test: "pytest src/tests/ -v"
  test_coverage: "pytest src/tests/ -v --cov=src/app --cov-report=term-missing"
  lint: "ruff check src/"
  format: "ruff format src/"
  typecheck: "pyright"
  all_checks: "ruff check src/ && ruff format src/ && pyright"

# ──────────────────────────────────────────────────────────────
# FILE STRUCTURE — ACTUAL (verified: ls src/app/*.py)
# ──────────────────────────────────────────────────────────────
structure:
  app_root: src/app/
  test_dir: src/tests/

  source_files:
    - src/app/__init__.py # empty (0 lines)
    - src/app/models.py # domain models, exceptions, Email VO, type aliases (84 lines)

  test_files:
    - src/tests/test_book.py # Book creation + availability logic (5 tests)
    - src/tests/test_email.py # Email validation + normalization (2 tests)
    - src/tests/test_loan.py # Loan creation + due_date + validation (3 tests)
    - src/tests/test_user.py # User creation + validation (2 tests)

  config_files:
    - pyproject.toml
    - pyrightconfig.json
    - .pre-commit-config.yaml

  docs:
    - README.md
    - project_docs/ROADMAP_FINAL_2026.md
    - project_docs/stage_summaries.md
    - project_docs/design-notes/01-tdd-desde-cero.md

  skill_registry:
    - .atl/skill-registry.md # project root (active, updated 2026-07-05)
    - src/app/.atl/skill-registry.md # app-level (present but empty/legacy)

# ──────────────────────────────────────────────────────────────
# DOMAIN MODEL — ACTUAL (from src/app/models.py, 84 lines)
# ──────────────────────────────────────────────────────────────
domain:
  type_aliases:
    BookID: int # line ~5
    UserID: int
    LoanID: int

  exceptions:
    hierarchy:
      LibraryApiError: # base exception
        - BookError # no sub-subclasses
        - UserError
        - LoanError
    file: src/app/models.py
    note: >
      Hierarchy is currently flat (4 classes). BookNotFoundError and
      BookAlreadyLoanedError do NOT exist yet — they will be added when
      repository/service layers are built.

  value_objects:
    - name: Email
      kind: frozen dataclass
      file: src/app/models.py
      validation: regex in __post_init__
      behavior: normalizes to lowercase on construction

  entities:
    - name: Book
      kind: dataclass
      fields: [title, author, is_available, book_id]
      id_field: "book_id: BookID | None"
      invariants: title and author must be non-empty (validated in __post_init__)
      behavior: [can_be_loaned, mark_as_loaned]

    - name: User
      kind: dataclass
      fields: [username, email]
      id_field: none yet
      invariants: username must be non-empty (validated in __post_init__)
      note: email is an Email value object, not a plain string

    - name: Loan
      kind: dataclass
      fields: [book_id, user_id, loan_date, return_date, loan_id]
      id_field: "loan_id: LoanID | None"
      invariants: return_date cannot be earlier than loan_date
      computed: due_date property = loan_date + 30 days

# ──────────────────────────────────────────────────────────────
# CODE CONVENTIONS
# ──────────────────────────────────────────────────────────────
conventions:
  # Typing
  union_syntax: "X | None" # preferred over Optional[X]
  type_aliases: true # BookID, UserID, LoanID
  strict_pyright: true # typeCheckingMode = strict

  # Models
  domain_model_kind: dataclass # NOT Pydantic (Stage 1)
  model_id_default: None # IDs assigned by persistence layer

  # Naming
  case_convention:
    variables: snake_case
    functions: snake_case
    classes: PascalCase
    constants: UPPER_SNAKE_CASE
  language: english # code, docstrings, comments

  # Formatting
  line_length: 88 # enforced by Ruff
  quote_style: double # enforced by ruff format

  # TDD
  tdd_rule: strict # RED → GREEN → TRIANGULATE → REFACTOR
  no_code_before_failing_test: true

# ──────────────────────────────────────────────────────────────
# CURRENT TEST STATUS
# ──────────────────────────────────────────────────────────────
test_status:
  total_tests: 12
  passing: 12
  failing: 0
  coverage_percent: 100
  covered_module: src/app/models.py
  pyright_errors: 0
  ruff_warnings: 0
  last_verified: "2026-07-10"

# ──────────────────────────────────────────────────────────────
# KNOWN TECH DEBT — STAGE 1
# ──────────────────────────────────────────────────────────────
tech_debt:
  - id: TD-003
    file: src/app/models.py
    description: >
      User.email is validated with a plain regex in Email.__post_init__.
      This should be replaced by Pydantic v2 validators when Stage 3 introduces Pydantic.
      Acceptable as manual validation for Stage 1.
    severity: minor
    stage_to_fix: 3

  - id: TD-004
    files: [pyproject.toml, openspec/config.yaml]
    description: >
      Four fields are duplicated between pyproject.toml and openspec/config.yaml
      (name, version, author, line-length). Keep them in sync manually.
    severity: minor
    stage_to_fix: 1
    resolution: note_only

  - id: TD-005
    description: >
      Book, User, and Loan entities live in a single models.py file (84 lines).
      As the domain grows, split into separate modules (models/book.py, etc.).
      Acceptable for Stage 1's small domain.
    severity: minor
    stage_to_fix: 2

# ──────────────────────────────────────────────────────────────
# SDD CONFIGURATION
# ──────────────────────────────────────────────────────────────
sdd:
  mode: strict_tdd
  description: >
    Test-driven development is mandatory from Stage 1 onward.
    No production code is written before a failing test exists.
    The unit-test suite must be implementation-agnostic: swapping
    any persistence implementation must not require test changes.

  execution_mode: interactive # pause between phases, confirm before next
  artifact_store: both # openspec files + Engram memory
  chained_pr_strategy: auto-forecast
  review_budget_lines: 200

  phase_gate: one_at_a_time
  approval_keywords: ["continue", "dale", "go on", "next"]

  proposal_question_rounds: true
  skip_harness_questions_at_proposal: true

  phases:
    explore:
      description: Read code, identify gaps, summarise current state
    proposal:
      description: PRD-style change proposal with scope and constraints
      question_rounds: "1-2"
    spec:
      description: Behaviour specification (Given/When/Then)
    design:
      description: Module-level design, interfaces, data flow
    tasks:
      description: Ordered implementation task list with AC per task
    apply:
      description: Write production + test code, TDD red-green-refactor
    verify:
      description: Run test suite, lint, typecheck; report results

  stage_1_done_when:
    - Repository implementation swappable without touching tests
    - "Pyright strict mode: zero errors"
    - "Ruff: zero lint warnings"
    - "Coverage: >=90% on business logic"

# ──────────────────────────────────────────────────────────────
