[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# NOTE: name, version, author, and ruff line-length are also in openspec/config.yaml — keep in sync
[project]
name = "library-api"
version = "1.0.0"
description = "Library Management System API - An evolutionary backend development journey"
readme = "README.md"
authors = [
    {name = "Hector Gancedo Grade"}
]
requires-python = ">=3.10"
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.11.0",
    "fastapi==0.122.0",
    "h11==0.16.0",
    "idna==3.11",
    "pydantic==2.12.5",
    "pydantic_core==2.41.5",
    "sniffio==1.3.1",
    "starlette==0.50.0",
    "typeguard==4.4.4",
    "typing_extensions==4.15.0",
    "uvicorn==0.38.0",
]

[project.optional-dependencies]
dev = [
    "annotated-doc==0.0.4",
    "click==8.3.1",
    "colorama==0.4.6",
    "pre-commit==4.5.1",
    "packaging==25.0",
    "ruff==0.15.0",
    "pipdeptree==2.30.0",
    "platformdirs==4.5.0",
    "pytokens==0.3.0",
    "typing-inspection==0.4.2",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    ".coverage",
    "htmlcov",
    "dist",
    "build",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pylance]
pythonVersion = "3.13"
