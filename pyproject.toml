[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# NOTE: name, version, author, and ruff line-length are also in openspec/config.yaml — keep in sync
[project]
name = "library-api"
version = "1.0.0"
description = "Library Management System API - An evolutionary backend development journey"
readme = "README.md"
authors = [{ name = "Hector Gancedo Grade" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "pyright==1.1.410",
  "pre-commit==4.5.1",
  "ruff==0.15.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]
exclude = [
  ".git",
  "__pycache__",
  ".venv",
  ".pytest_cache",
  ".ruff_cache",
  ".coverage",
  "htmlcov",
  "dist",
  "build",
  "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pylance]
pythonVersion = "3.13"
