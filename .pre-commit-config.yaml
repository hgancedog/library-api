repos:
  - repo: local
    hooks:
      - id: check-venv
        name: Check virtual environment is active
        entry: python scripts/check_venv.py
        language: system
        stages: [pre-commit]

      - id: pyright
        name: Pyright type check
        entry: pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: check-language
        name: Check language consistency
        entry: check-language
        language: system
        types_or: [markdown, text]
        files: "^project_docs/"
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
